# Serves the Live bundle and mirrors the dev server's same-origin proxy (vite.config.ts).
server {
    listen 80;
    root /usr/share/nginx/html;

    # Resolve upstreams per request, so nginx starts while a site agent is still down.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $central_upstream http://central:8080;
    set $site_1_upstream http://site-agent:8081;

    location / {
        try_files $uri /index.html;
    }

    location /api/central/ {
        rewrite ^/api/central(/.*)$ $1 break;
        proxy_pass $central_upstream;
    }

    location /api/sites/site-1/ {
        rewrite ^/api/sites/site-1(/.*)$ $1 break;
        proxy_pass $site_1_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        # The lane feed is a server-sent event stream, which buffering would hold back.
        proxy_buffering off;
        proxy_read_timeout 1h;
    }
}
