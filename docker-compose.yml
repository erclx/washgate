# Each component owns its services in its own compose.yaml, pulled in here. This file keeps only what no component owns.
include:
  - core/compose.yaml
  - invoicing/compose.yaml
  - plate-reader/compose.yaml
  - web/compose.yaml

services:
  mariadb:
    image: mariadb:11.8
    environment:
      MARIADB_DATABASE: ${DB_NAME:-washgate}
      MARIADB_USER: ${DB_USER:-washgate}
      MARIADB_PASSWORD: ${DB_PASSWORD:-washgate}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-washgate-root}
    ports:
      - '127.0.0.1:${MARIADB_PORT:-3306}:3306'
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    image: mariadb:11.8
    entrypoint: ['bash', '/scripts/migrate.sh']
    command: ['up']
    environment:
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-washgate}
      DB_USER: ${DB_USER:-washgate}
      DB_PASSWORD: ${DB_PASSWORD:-washgate}
    volumes:
      - ./core/migrations:/migrations:ro
      - ./scripts/migrate.sh:/scripts/migrate.sh:ro
    depends_on:
      mariadb:
        condition: service_healthy
    restart: 'no'

  # Demo customers and prices for the customer app. Every insert updates a row it finds in place, so each `up` reruns it harmlessly.
  seed:
    image: mariadb:11.8
    entrypoint: ['bash', '-c']
    command:
      [
        'mariadb --host=mariadb --user="$$DB_USER" "$$DB_NAME" < /seed/demo.sql && echo "demo seed applied"',
      ]
    environment:
      DB_NAME: ${DB_NAME:-washgate}
      DB_USER: ${DB_USER:-washgate}
      MYSQL_PWD: ${DB_PASSWORD:-washgate}
    volumes:
      - ./core/seed/demo.sql:/seed/demo.sql:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: 'no'

volumes:
  mariadb-data:
